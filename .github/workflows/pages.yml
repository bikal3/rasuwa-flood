# Build the site and publish it to GitHub Pages.
#
# The site is not committed -- .gitignore excludes /site/ because it is entirely
# reproducible from web/ -- so it is built here on every push to main and handed
# straight to Pages as an artifact. Nothing is committed back to the repo.
#
# web/public/data/ IS committed, which is what makes this possible: the site's
# layers come from pipeline/stage4_hot.py, which needs Earth Engine credentials
# this runner does not have and should not have.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# What deploy-pages needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: node build.mjs
        working-directory: web

      # The same check that runs locally: every page renders, every layer
      # resolves, every internal link points at a file that exists. A broken
      # build fails here rather than going live.
      - name: Check
        run: node smoke.mjs
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
