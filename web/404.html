<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rasuwa Flood 2026</title>
<meta name="theme-color" content="#f2f0e9">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<!--
  Absolute paths, unlike every other page on the site.

  Cloudflare Pages serves this one file for any unmatched URL, at whatever depth
  the visitor typed -- /map/terrain, /2026/august, /downlods -- so there is no
  fixed number of "../" that gets back to the root. The other ten pages each sit
  exactly one level down and carry a stamped relative data-base, which is what
  lets the site be mounted in a subdirectory; this page trades that away for
  working at an unknown depth, which is the only thing it has to do.

  It also loads no JavaScript. A 404 that needs the bundle to render is a 404
  that shows nothing when the bundle is what went missing, and there is nothing
  here for React to do: the page is a list of links known at build time.
-->
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <a class="brand" href="/">
    <span class="mark" aria-hidden="true">🌊</span>
    <span>
      <b>Rasuwa Flood 2026</b>
      <span class="sub">Bhote Koshi · Nepal</span>
    </span>
  </a>

  <p class="page-kicker">404</p>
  <h1 class="page-title">That page isn’t here</h1>
  <p class="lede">
    The address you followed doesn’t match anything on this site — it may have
    been mistyped, or it may have been a link from before the site was
    reorganised. Everything that is here is below.
  </p>

  <div class="cards">
{{cards}}
  </div>
</main>
</body>
</html>
