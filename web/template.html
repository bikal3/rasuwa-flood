<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titletag}}</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#f2f0e9">
<link rel="canonical" href="{{url}}">
<!-- How this site is actually reached: someone pastes the link into a chat.
     Without these it arrives as a bare URL. og: is read by Facebook, WhatsApp,
     Signal, Slack, LinkedIn and Twitter alike, so only the one tag Twitter has
     no og: equivalent for is repeated below. Each page carries its own title,
     description and canonical URL; the card image is the same for all ten. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rasuwa Flood 2026">
<meta property="og:locale" content="en">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{titletag}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="{{imagew}}">
<meta property="og:image:height" content="{{imageh}}">
<meta property="og:image:alt" content="{{imagealt}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Source Serif 4 for reading, Söhne-ish grotesque duties go to Public Sans,
     IBM Plex Mono for every figure. A public information site is read on a
     phone in a browser tab, not printed, so the body face is the sans and the
     serif is reserved for the long explanatory passages that earn it. -->
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="stylesheet" href="{{base}}app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="root" data-page="{{page}}" data-base="{{base}}"></div>
<script src="{{base}}app.js" defer></script>
</body>
</html>
